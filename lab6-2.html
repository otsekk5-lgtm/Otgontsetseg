<!DOCTYPE html>
<html>
<head></head>
<body style="margin:0">
    <canvas id="myCanvas" width="500" height="500" style="border:1px solid blue"></canvas>
    
    <script>
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");

        let x = 30, y = 30, orgon = 60, ondor = 20;

        ctx.beginPath();
        ctx.rect(x, y, orgon, ondor);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.closePath();

        x+=80;
        if (x > 500) {
            x = 30;
            y += 40;
        }
        ctx.beginPath();
        ctx.rect(x, y, orgon, ondor);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.closePath();

        x+=80;
        if (x > 500) {
            x = 30;
            y += 40;
        }
        ctx.beginPath();
        ctx.rect(x, y, orgon, ondor);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.closePath();

        x+=80;
        if (x > 500) {
            x = 30;
            y += 40;
        }
    </script>
</body>
</html>
